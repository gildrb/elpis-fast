# Canonical EXL3 deployment. Context/cache settings do not establish qualification.
# Build with bash docker/build-exl3.sh; it authenticates the existing local base.
services:
  inference:
    image: ${QWEN_IMAGE:-qwen-inference:exl3}
    pull_policy: never
    # Rootless default maps container root to the operator; rootful must set host UID:GID.
    user: "${QWEN_CONTAINER_USER:-0:0}"
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 32gb
    tmpfs:
      - /run:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=2g
    ports:
      - "127.0.0.1:${QWEN_PORT:-18020}:18020"
    environment:
      # Explicit acknowledgment, not a claim of capacity, quality or performance.
      QWEN_ALLOW_UNQUALIFIED: ${QWEN_ALLOW_UNQUALIFIED:-0}
      # Persistent prefix cache (/prefix-cache below): 0 turns it off; only candidate-ext images
      # carry its engine, so other variants need 0. The cache is bound to the image ID, taken from
      # the guardian launch gate or, for this plain launch, QWEN_IMAGE_ID (the full image ID
      # sha256:<64 hex> of QWEN_IMAGE); without either it stays off.
      QWEN_PREFIX_PERSIST: ${QWEN_PREFIX_PERSIST:-1}
      QWEN_IMAGE_ID: ${QWEN_IMAGE_ID:-}
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -B, /opt/qwen/serve/healthcheck.py]
      interval: 30s
      timeout: 315s
      start_period: 20m
      retries: 3
    volumes:
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/qwen-inference-launch.lock
        target: /run/qwen-inference-launch.lock
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/api-key
        target: /app/api_key.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/cache
        target: /cache
        bind:
          create_host_path: false
      # Operator-owned, mode 0700; holds K/V derived from prompts. Never mount it in research,
      # candidate or lane containers.
      - type: bind
        source: ${QWEN_STATE_ROOT:?Set QWEN_STATE_ROOT to the existing model state directory}/prefix-cache
        target: /prefix-cache
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 48G
        reservations:
          devices:
            - driver: cdi
              device_ids: ["nvidia.com/gpu=0"]
              capabilities: [gpu]

[project]
name = "local-inference-benchmarks"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "numpy==2.5.3",
    "ruff==0.16.10",
    "tokenizers==0.23.2",
    "ty==0.0.80",
]

[tool.ruff]
required-version = "==0.16.10"
target-version = "py313"
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
# D203 conflicts with D211; D213 conflicts with D212. The remaining rules
# conflict with Ruff's formatter (see docs/development.md).
ignore = [
    "incorrect-blank-line-before-class", "multi-line-summary-second-line",
    "missing-trailing-comma", "prohibited-trailing-comma", "docstring-tab-indentation", "triple-single-quotes", "indentation-with-invalid-multiple", "indentation-with-invalid-multiple-comment", "over-indented",
    "bad-quotes-inline-string", "bad-quotes-multiline-string", "bad-quotes-docstring", "avoidable-escaped-quote", "tab-indentation",
    # S404 flags every `import subprocess`; S603 still checks every call.
    "suspicious-subprocess-import",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"
# The links run as scripts: their own directory is first on sys.path.
extra-paths = ["bend", "bend/gen"]

[tool.ty.src]
# Checked in other environments (docs/development.md): the serving image
# (torch, triton, exllamav3, jsonschema) and eval/direct/mrcr/.venv (verifiers).
exclude = [
    "serve/exl3_server.py",
    "bench/exl3_accept_latency.py",
    "eval/direct",
]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

    "renderers>=0.1.8.dev28; extra == 'renderers'",
    "reasoning-gym; extra == 'rg'",
    "accelerate>=1.4.0; extra == 'rl'",
    "deepspeed>=0.17.6; extra == 'rl'",
    "flash-attn>=2.8.3; extra == 'rl'",
